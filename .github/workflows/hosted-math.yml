name: Hosted mathematics

on:
  pull_request:
    paths:
      - '**.md'
      - 'verification/hosted/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install capture dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/math-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/math-deps/node_modules/.bin/playwright" install chromium

      - name: Capture the actual GitHub mathematics
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          NODE_PATH="$RUNNER_TEMP/math-deps/node_modules" node verification/hosted/run_hosted_check.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/hosted-evidence"

      - name: Retain the report and actual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-evidence
          if-no-files-found: error
          retention-days: 30
